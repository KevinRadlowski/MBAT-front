<mat-card class="confirmation-card">
  <mat-card-header class="confirmation-header">
    <mat-card-title>{{ data.title }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <p>{{ data.message }}</p>

    <!-- Champ de mot de passe affiché seulement si "requirePassword" est true -->
    <form *ngIf="data.requirePassword" [formGroup]="passwordForm">
      <mat-form-field appearance="outline" class="form-field-width">
        <mat-label>Mot de passe</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput type="password" formControlName="password" required>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions fxLayout="row" fxLayoutAlign="space-between center">
    <button mat-stroked-button (click)="onCancel()" class="btn-cancel">Annuler</button>
    <button mat-raised-button color="warn" (click)="onConfirm()" [disabled]="data.requirePassword && passwordForm.invalid" class="btn-confirm">
      Confirmer
    </button>
  </mat-card-actions>
</mat-card>
